<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>牛来·梦境狂奔 微信小游戏 集成测试(真实 game.js)</title>
<style>
  html, body { margin: 0; background: #111; overflow: hidden; }
  #canvas-slot { position: fixed; inset: 0; }
  #canvas-slot canvas { width: 100%; height: 100%; display: block; }
  #result { position: fixed; left: 8px; top: 8px; z-index: 99; font: 12px monospace;
            color: #fff; max-width: 98vw; white-space: pre-wrap; background: rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="canvas-slot"></div>
<pre id="result">running...</pre>
<script src="wx-shim.js"></script>
<script src="boot.js"></script>
<script src="lib.js"></script>
<script>
// 提供浏览器版 require(game.js 顶部 require('./adapter/weapp-adapter.js'))
window.require = function (id) {
  if (String(id).includes('weapp-adapter')) return window.__weapp;
  throw new Error('unexpected require: ' + id);
};
// 帧率节流(仅测试环境):真实微信里 rAF 由平台驱动;浏览器测试里每帧都走 SwiftShader
// 软渲染,1.3MB 打包产物全量渲染太慢。游戏只依赖 dt(上限 0.05s),把 rAF 节流到
// 虚拟 200ms/帧 → 游戏以 5fps 逻辑运行,虚拟时间预算内能跑完"自然撞死"全流程。
window.requestAnimationFrame = function (cb) {
  return setTimeout(function () { cb(Date.now()); }, 200);
};
</script>
<script src="../game.js"></script>
<script src="integration-main.js"></script>
</body>
</html>

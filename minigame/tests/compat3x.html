<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>牛来·梦境狂奔 微信小游戏 3.x 恶劣环境兼容测试(冻结document+只读window)</title>
<style>
  html, body { margin: 0; background: #111; overflow: hidden; }
  #canvas-slot { position: fixed; inset: 0; }
  #canvas-slot canvas { width: 100%; height: 100%; display: block; }
  #result { position: fixed; left: 8px; top: 8px; z-index: 99; font: 12px monospace;
            color: #fff; max-width: 98vw; white-space: pre-wrap; background: rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="canvas-slot"></div>
<pre id="result">running...</pre>
<script>
// ===== 复刻微信基础库 3.16.x 的恶劣全局环境 =====
// 目标:在浏览器里重现用户实测的三种崩溃条件,验证 adapter 在其下能正常安装 shim:
//   1) window.document 为只读 getter(直接赋值抛 "Cannot set property document")
//   2) document 桩整体冻结(补写属性抛 "Cannot assign to read only property")
//   3) window 引用自身也是只读 getter
// 实现方式:定义全局 GameGlobal(adapter 优先采用它作为 _global),
// 在其上布置只读/冻结的桩属性;原生 TouchEvent/Event 保持存在(3.x 有原生 DOM)。
(function () {
  'use strict';
  // 冻结的残缺 document 桩:没有 getElementById(重现报错 #2 的对象)
  var frozenDoc = Object.freeze({
    createElementNS: function () { return {}; },
    body: Object.freeze({ appendChild: function () {} }),
    documentElement: Object.freeze({ style: {} }),
  });
  var G = (function () {
    var g = {};
    // 只读 document getter(重现报错 #1)
    Object.defineProperty(g, 'document', { get: function () { return frozenDoc; }, configurable: true });
    // 只读 window getter,指向自身(重现报错 #3 的环境特征)
    Object.defineProperty(g, 'window', { get: function () { return g; }, configurable: true });
    // 3.x 带原生式事件接口:读得到,不可写
    Object.defineProperty(g, 'addEventListener', { get: function () { return function () {}; }, configurable: true });
    Object.defineProperty(g, 'dispatchEvent', { get: function () { return function () { return true; }; }, configurable: true });
    return Object.freeze(g);
  })();
  window.GameGlobal = G;
  // adapter 里 _global !== globalThis 的双写路径也要求不抛
  window.__compat3x = { frozenDoc: frozenDoc, G: G };
  // 捕获 game.js 加载期的未捕获错误(console 未开启时也能看到)
  window.__compatErr = [];
  window.addEventListener('error', function (e) {
    window.__compatErr.push(String(e && e.message || e));
  });
})();
</script>
<script src="wx-shim.js"></script>
<script src="boot.js"></script>
<script src="lib.js"></script>
<script>
window.require = function (id) {
  if (String(id).includes('weapp-adapter')) return window.__weapp;
  throw new Error('unexpected require: ' + id);
};
window.requestAnimationFrame = function (cb) {
  return setTimeout(function () { cb(Date.now()); }, 200);
};
</script>
<script src="../game.js"></script>
<script src="compat-main.js"></script>
</body>
</html>
